syntax = "proto3";

package vlm;

// gRPC service exposed by the C++ client toward a prompt application.
// The prompt app:
//   * sends typing-state notifications (so the client can switch into
//     1 FPS capture mode while the user types);
//   * submits user queries and receives the VLM response back via a
//     server-streaming RPC.
service PromptApp {
  rpc NotifyTyping(TypingState) returns (Ack);
  rpc SubmitQuery(Query) returns (stream QueryResponse);
  rpc HealthCheck(Empty) returns (HealthStatus);
}

message Empty {}

message TypingState {
  bool is_typing = 1;
  int64 timestamp_ms = 2;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message Query {
  string session_id = 1;
  string text = 2;
  // Optional client-side hint about how many recent 1 FPS frames the
  // server should consider. 0 means "let the server decide".
  uint32 num_frames_hint = 3;
  // Wall-clock microseconds (Unix epoch) the prompt is anchored to —
  // typically the moment the user started typing the query. Lets the
  // server pick frames captured around that exact instant. 0 disables
  // time-window filtering and falls back to "everything in buffer".
  int64 trigger_ts_us = 4;
  // Half-windows around trigger_ts_us, in milliseconds. 0 -> server
  // default (3000 ms each).
  uint32 pre_window_ms = 5;
  uint32 post_window_ms = 6;
}

message QueryResponse {
  string session_id = 1;
  string text = 2;
  // Streaming token / chunk index. `done = true` marks the final
  // message of a response stream.
  uint32 chunk_index = 3;
  bool done = 4;
}

message HealthStatus {
  bool client_ok = 1;
  bool webrtc_connected = 2;
  string capture_mode = 3; // "idle" | "typing" | "query"
}
